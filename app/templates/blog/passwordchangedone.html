{% extends 'blog/base.html' %}
{% load static %}
{% block title %}Change Password Done{% endblock title %}

{% block content %}

<style>
body {
    background:radial-gradient(circle at top,#020f14,#00090c);
    color:#e6ffff;
}

.success-box {
    background:linear-gradient(145deg,#020f14,#00090c);
    border:1px solid rgba(0,255,255,0.2);
    border-radius:16px;
    box-shadow:0 0 25px rgba(0,255,255,0.2);
    padding:40px 20px;
    text-align:center;
}

h3 {
    color:#00f7ff;
    margin-bottom:20px;
    text-shadow:0 0 10px rgba(0,247,255,.6);
}

p{
    color:#9ffcff;
}

.giphy-embed {
    border-radius:14px;
    box-shadow:0 0 20px rgba(138,125,255,0.5);
}

a.btn {
    background:linear-gradient(135deg,#00f7ff,#8a7dff);
    border:none;
    color:#020b10;
    font-weight:600;
    margin-top:20px;
}

a.btn:hover {
    background:linear-gradient(135deg,#8a7dff,#00f7ff);
    box-shadow:0 0 15px rgba(138,125,255,0.8);
}
</style>

<div class="container my-5">
  <div class="row justify-content-center">

    <div class="col-sm-6">
      <div class="success-box">

        <h3>
          Password Changed Successfully ✅
        </h3>

        <p>
          {{ request.user.username }}, your password has been updated.
        </p>

        <div class="my-3">
          <iframe
            src="https://giphy.com/embed/b2VxjMhx8nnjy"
            width="200"
            height="200"
            frameborder="0"
            allowfullscreen
            class="giphy-embed">
          </iframe>
        </div>

        <a href="{% url 'home' %}" class="btn">
          Go to Home
        </a>

      </div>
    </div>

  </div>
</div>

{% endblock content %}
