{% extends 'blog/base.html' %}
{% load static %}
{% block title %}Password Reset Done{% endblock title %}

{% block content %}

<style>
body{
  background: radial-gradient(circle at top, #0f2f2f, #050d0d);
  color:#e6fffa;
}

.alert-box{
  background: linear-gradient(180deg,#0e2a2a,#061818);
  border-radius:18px;
  border:1px solid rgba(0,255,200,.25);
  box-shadow:0 0 30px rgba(0,255,200,.2);
  padding:40px;
  text-align:center;
}

h4{
  color:#7fffe1;
  text-shadow:0 0 10px rgba(127,255,225,.6);
}

p{
  color:#cffff3;
}

strong{
  color:#00ffbe;
}
</style>

<div class="container">
  <div class="row my-5">
    <div class="col-sm-6 offset-sm-3">

      <div class="alert-box">
        <h4>Well Done! 🎉</h4>
        <p>Password reset email has been sent.</p>
        <strong>Please check your email.</strong>
      </div>

    </div>
  </div>
</div>

{% endblock content %}
