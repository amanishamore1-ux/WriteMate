{% extends 'blog/base.html' %}
{% load static %}
{% block title %}Password Reset Complete{% endblock title %}

{% block content %}

<style>
body{
  background: radial-gradient(circle at top, #0f2f2f, #050d0d);
  color:#e6fffa;
}

.success-box{
  background: linear-gradient(180deg,#0e2a2a,#061818);
  border-radius:18px;
  border:1px solid rgba(0,255,200,.25);
  box-shadow:0 0 30px rgba(0,255,200,.2);
  padding:40px;
  text-align:center;
}

h4{
  color:#7fffe1;
  text-shadow:0 0 10px rgba(127,255,225,.6);
}

a.btn{
  background: linear-gradient(90deg,#00ffbe,#00cfa0);
  border:none;
  color:#003333;
  font-weight:bold;
  box-shadow:0 0 18px rgba(0,255,190,.6);
}
</style>

<div class="container">
  <div class="row my-5">
    <div class="col-sm-6 offset-sm-3">

      <div class="success-box">
        <h4>Password Reset Successful ✅</h4>

        <div class="my-3">
          <iframe 
            src="https://giphy.com/embed/b2VxjMhx8nnjy"
            width="200"
            height="200"
            frameborder="0"
            allowfullscreen>
          </iframe>
        </div>

        <p class="mt-3">
          Your password has been reset successfully.
        </p>

        <a href="{% url 'login' %}" class="btn mt-3">
          Login Now
        </a>
      </div>

    </div>
  </div>
</div>

{% endblock content %}
